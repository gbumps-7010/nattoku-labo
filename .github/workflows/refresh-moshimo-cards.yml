name: かんたんリンクの自動更新

# 毎週月曜 6:00（日本時間）。Actions 画面の「Run workflow」から手動でも実行できる。
on:
  schedule:
    - cron: "0 21 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-moshimo-cards
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 楽天の最新情報でカードを更新
        run: python scripts/refresh-moshimo-cards.py --apply

      - name: 変更があればコミット
        run: |
          if git diff --quiet; then
            echo "変更なし"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products/data makers
          git commit -m "Refresh Moshimo easy-link cards from Rakuten"
          git push
